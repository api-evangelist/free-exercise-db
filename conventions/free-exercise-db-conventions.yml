  data_model: data-model/free-exercise-db-data-model.yml
  vocabulary: vocabulary/free-exercise-db-vocabulary.yml
  lifecycle: lifecycle/free-exercise-db-lifecycle.yml
  rate_limits: rate-limits/free-exercise-db-rate-limits.yml
