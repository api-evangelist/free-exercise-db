aid: free-exercise-db
name: Free Exercise DB
description: 'Free Exercise DB is an open, public-domain exercise dataset published by
  yuhonas on GitHub: 873 individual JSON documents describing strength, stretching,
  plyometric, powerlifting, olympic-weightlifting, strongman and cardio exercises, each
  with a stable id, name, difficulty level, force and mechanic classification, required
  equipment, primary and secondary muscle groups, step-by-step instructions and
  demonstration images. Every record validates against a published JSON Schema
  (draft-04) that also acts as the project''s controlled vocabulary for muscles,
  equipment and categories. There is no REST API and no OpenAPI: consumption is by
  unauthenticated HTTPS GET of the combined dist/exercises.json array (or of a single
  exercise document) from raw.githubusercontent.com, with images served from the same
  host. A Vue.js browsable/searchable frontend is published to GitHub Pages. The whole
  dataset is released under the Unlicense.'
