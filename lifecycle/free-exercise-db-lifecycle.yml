name: Free Exercise DB Lifecycle
summary: >-
  An unversioned, continuously-published open dataset. Everything a mature API lifecycle
  would carry — releases, a deprecation policy, an SLA, a status page — is genuinely absent,
  and the only lifecycle machinery the project operates is a CI job that lints and deploys
  on every push to main.
versioning:
  scheme: none
  detail: >-
    The GitHub repository has zero releases and zero tags (checked via the GitHub API). The
    dataset is consumed from the `main` ref, which floats. A consumer can pin a commit SHA in
    the raw.githubusercontent.com path, but the provider publishes no version identifier of
    its own and no changelog.
  pinnable: true
  pin_mechanism: git commit SHA substituted for `main` in the raw content URL
deprecation_policy:
  published: false
  detail: No deprecation or sunset policy. No RFC 8594 Deprecation/Sunset headers. No Deprecation pointer is emitted.
sunset_headers: false
sla:
  published: false
  detail: >-
    None. Availability is whatever GitHub Pages and raw.githubusercontent.com provide; the
    provider makes no commitment and the Unlicense disclaims all warranty.
status_page:
  published: false
  detail: >-
    The project operates no status page. githubstatus.com covers the hosting, but that is
    GitHub's status page for GitHub's platform, not a provider-published surface — asserting
    it here would credit this project with someone else's operations. No StatusPage pointer
    is emitted.
